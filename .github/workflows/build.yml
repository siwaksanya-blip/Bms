name: Сборка Jikong Smart BMS

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: |
          pip install esphome==2024.11.0

      - name: Build ESPHome Firmware
        run: |
          esphome compile smart-bms.yaml

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: jk-bms-firmware-bin
          path: |
            .esphome/build/jk-bms/.pioenvs/jk-bms/firmware.bin
